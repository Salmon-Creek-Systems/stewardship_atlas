name: Deploy cloud substrate

# Builds the API container, pushes it to ECR, and deploys the cloud-native
# substrate stack (documents/cloud_native_plan.md, Phase 1b).
#
# Auth is GitHub OIDC — no AWS keys are stored in this repo. The role is created
# by the AtlasGithubOidc stack, which is deployed once from a laptop.
#
# The AtlasCloud-<env> stack must already exist (first deploy is from a laptop,
# with no api_image_tag, which creates the ECR repository this workflow pushes
# to). See infrastructure/cdk/README.md.

on:
  workflow_dispatch:
    inputs:
      env_name:
        description: Which substrate instance to deploy
        default: prod
        type: string
  push:
    branches: [main]
    paths:
      - infrastructure/cdk/**
      - infrastructure/api/**
      - python/**
      - templates/**
      - configuration/shared_*.json
      - .github/workflows/deploy-cloud.yml
      # Docs don't change infrastructure, and every run rebuilds and pushes an
      # image tagged with the commit SHA.
      - '!infrastructure/**/*.md'

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

env:
  AWS_REGION: us-east-1
  DEPLOY_ROLE: arn:aws:iam::438886543302:role/atlas-github-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment
        id: target
        run: |
          ENV_NAME="${{ inputs.env_name || 'prod' }}"
          # Prod deploys only from main. A branch may deploy staging (the cloud
          # migration rehearses there before cutover); the OIDC trust allows
          # that branch too, so this check is what keeps it off prod.
          if [ "$ENV_NAME" = "prod" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::prod deploys only from main (this is $GITHUB_REF)"
            exit 1
          fi
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          # cdk.json pins prod's domain and certificate; any other environment
          # must blank them or it tries to claim next.fireatlas.org.
          # With no domain, the Cognito callback host can't come from the
          # distribution (a dependency cycle; see atlas_cloud_stack.py), so
          # staging names its CloudFront host here.
          if [ "$ENV_NAME" = "prod" ]; then
            echo "context_flags=" >> "$GITHUB_OUTPUT"
          elif [ "$ENV_NAME" = "staging" ]; then
            echo "context_flags=-c atlas_domain= -c certificate_arn= -c callback_host=d1y2f6bmf8ds3m.cloudfront.net" >> "$GITHUB_OUTPUT"
          else
            echo "context_flags=-c atlas_domain= -c certificate_arn=" >> "$GITHUB_OUTPUT"
          fi
          echo "ecr_repo=atlas-api-$ENV_NAME" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check the ECR repository exists
        run: |
          if ! aws ecr describe-repositories \
                 --repository-names "${{ steps.target.outputs.ecr_repo }}" \
                 --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "::error::ECR repo ${{ steps.target.outputs.ecr_repo }} not found."
            echo "::error::Run the first deploy from a laptop (no api_image_tag) to create it."
            exit 1
          fi

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push the API image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ steps.target.outputs.ecr_repo }}:${GITHUB_SHA}"
          # Built from the repo root: the image carries python/, templates/
          # and configuration/ (see infrastructure/api/Dockerfile, .dockerignore).
          # No provenance/SBOM attestations: they make the push an OCI image
          # index, and Lambda accepts only a plain image manifest
          # ("image manifest ... media type ... is not supported").
          docker build --provenance=false --sbom=false \
            -f infrastructure/api/Dockerfile -t "$IMAGE" .
          # The image must import its entry points before it ships.
          docker run --rm --entrypoint python -e SWALES_ROOT=/tmp/x "$IMAGE" -c \
            "import api_handler, jobs_handler, atlas, jwt, cryptography; from osgeo import gdal; print('imports ok', gdal.__version__)"
          docker push "$IMAGE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install CDK
        run: |
          # cdk.json runs the app with ../../.venv/bin/python3
          python -m venv .venv
          .venv/bin/pip install --quiet -r infrastructure/cdk/requirements.txt
          npm install -g aws-cdk@2

      - name: Stage the email-inlet Lambda bundle
        run: |
          # app.py constructs every stack, and the email stack's asset directory
          # is gitignored, so synth fails without it — even though this workflow
          # only deploys AtlasCloud.
          pip install --quiet -r infrastructure/lambda/requirements.txt \
            -t infrastructure/lambda_build/
          cp infrastructure/lambda/email_photo_handler.py infrastructure/lambda_build/

      - name: Deploy
        working-directory: infrastructure/cdk
        run: |
          cdk deploy "AtlasCloud-${{ steps.target.outputs.env_name }}" \
            -c "env_name=${{ steps.target.outputs.env_name }}" \
            -c "api_image_tag=${GITHUB_SHA}" \
            ${{ steps.target.outputs.context_flags }} \
            --require-approval never
