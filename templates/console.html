<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/local/css/console.css">
</head>
<body>
    <header class="top-bar">
        <img id="logo" />
        <div class="top-bar-title">
            <span class="atlas-name" id="swale-name"></span>
            <span class="console-type" id="console-type"></span>
        </div>
    </header>

    <div class="console-layout">
        <nav class="sidebar">
            <div class="sidebar-section" id="interfaces-section" style="display: none;">
                <h2>Maps</h2>
                <ul id="interfaces-list"></ul>
            </div>

            <div class="sidebar-section" id="downloads-section" style="display: none;">
                <h2>Downloads</h2>
                <ul id="downloads-list"></ul>
            </div>

            <div class="sidebar-section">
                <h2>Help</h2>
                <ul id="help-list">
                    <li><a href="/local/documents/about.html">About</a></li>
                    <li><a href="/local/documents/help/index.html">Help</a></li>
                    <li><a href="/staging/outlets/html/internal">Internal</a></li>
                    <li><a href="/staging/outlets/html/admin">Admin</a></li>
                    <li><a href="https://www.google.com/maps/search/volunteer+fire+departments">VFD</a></li>
                    <li><a href="/local/documents/contact.html">Contact</a></li>
                </ul>
            </div>

            <div class="sidebar-section" id="versions-section">
                <h2>Versions</h2>
                <div class="version-string">version: <span id="version-string"></span></div>
                <div class="version-controls">
                    <button id="publish-button" class="btn" onclick="startPublish()">Publish Atlas</button>
                    <button id="rollback-button" class="btn" onclick="startRollback()">Rollback</button>
                    <button id="reset-staging-button" class="btn btn-destructive" onclick="startResetStaging()">Reset Staging</button>
                </div>
                <div id="publish-status"></div>
                <ul id="versions-list"></ul>
            </div>
        </nav>

        <main class="main-content" id="layers-section">
            <h2 id="panel-header">...</h2>
            <div id="webmap-embed"></div>
            <div id="gazetteer-embed"></div>
            <ul id="layers-list"></ul>
            <ul id="usecases-list"></ul>
        </main>
    </div>

    <script>
      function initializePage(data) {
            if (data.logo) document.getElementById('logo').src = data.logo;
            document.getElementById('version-string').textContent = data.version_string;
            document.getElementById('swale-name').textContent = data.swaleName;
            document.getElementById('console-type').textContent = data.consoleType;
            document.getElementById('panel-header').textContent = data.panelHeader;

            swalename = data.swaleName;
            baseurl = data.baseurl;
            atlasappport = data.atlasappport;

            // Hide panel header if empty
            if (!data.panelHeader) {
                document.getElementById('panel-header').style.display = 'none';
            }

            // Embed webmap if materialized
            if (data.webmapAvailable) {
                document.getElementById('layers-section').classList.add('has-webmap');
                const webmapDiv = document.getElementById('webmap-embed');
                const iframe = document.createElement('iframe');
                iframe.src = '../../webmap/';
                iframe.className = 'embed-iframe webmap-iframe';
                iframe.title = 'Atlas Webmap';
                webmapDiv.appendChild(iframe);
                webmapDiv.style.display = 'block';
            }

            // Embed gazetteer index if materialized
            if (data.gazetteerAvailable) {
                const gazDiv = document.getElementById('gazetteer-embed');
                const iframe = document.createElement('iframe');
                iframe.src = '../../gazetteer/';
                iframe.className = 'embed-iframe gazetteer-iframe';
                iframe.title = 'Gazetteer Index';
                gazDiv.appendChild(iframe);
                gazDiv.style.display = 'block';
            }

            // Setup interfaces
            if (data.interfaces && data.interfaces.length > 0) {
                const interfacesList = document.getElementById('interfaces-list');
                data.interfaces.forEach(item => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = `../../${item.name}/`;
                    a.textContent = item.name;
                    li.appendChild(a);
                    interfacesList.appendChild(li);
                });
                document.getElementById('interfaces-section').style.display = 'block';
            }

            // Setup downloads
            if (data.downloads && data.downloads.length > 0) {
                const downloadsList = document.getElementById('downloads-list');
                data.downloads.forEach(item => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = `../${item.name}/`;
                    a.textContent = item.name;
                    li.appendChild(a);
                    downloadsList.appendChild(li);
                });
                document.getElementById('downloads-section').style.display = 'block';
            }

            // Setup versions
            if (data.versions && data.versions.length > 0) {
                const versionsList = document.getElementById('versions-list');
                data.versions.forEach(item => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = `/${item}/outlets/html/admin`;
                    a.textContent = item;
                    if (item === data.version_string) {
                        a.classList.add('current-version');
                        a.textContent = item + ' (current)';
                    }
                    li.appendChild(a);
                    versionsList.appendChild(li);
                });
            }

            // Setup use cases
            function renderUseCases(useCases) {
                const useCasesList = document.getElementById('usecases-list');
                useCasesList.innerHTML = '';
                useCases.forEach(usr => {
                    const li = document.createElement('li');
                    li.textContent = usr.name;
                    const casesList = document.createElement('ul');
                    (usr.cases || []).forEach(ucase => {
                        const icli = document.createElement('li');
                        const ica = document.createElement('a');
                        ica.href = ucase.uri;
                        ica.textContent = ucase.name;
                        icli.appendChild(ica);
                        casesList.appendChild(icli);
                    });
                    li.appendChild(casesList);
                    useCasesList.appendChild(li);
                });
            }
            if (data.useCases && data.useCases.length > 0) {
                renderUseCases(data.useCases);
            }

            // For the technical console, fetch live log data on load
            if (data.consoleType === 'TECHNICAL') {
                document.getElementById('usecases-list').innerHTML = '<li>Loading log…</li>';
                fetch(`${baseurl}:${atlasappport}/log/${swalename}`)
                    .then(r => r.json())
                    .then(d => { if (d.useCases) renderUseCases(d.useCases); })
                    .catch(() => renderUseCases([{name: 'Log unavailable', cases: []}]));
            }

            // Setup layers
            if (data.layers && data.layers.length > 0) {
                const layersList = document.getElementById('layers-list');

                data.layers.forEach(item => {
                    const li = document.createElement('li');

                    // Layer name → outlet directory
                    const a1 = document.createElement('a');
                    a1.href = `../../../layers/${item.name}/`;
                    a1.textContent = item.name;
                    li.appendChild(a1);

                    // Draw
                    const a2 = document.createElement('a');
                    a2.href = `../../webedit/${item.name}_create.html`;
                    a2.textContent = ' (draw) ';
                    a2.className = 'action-mutate';
                    li.appendChild(a2);

                    // Edit
                    const al = document.createElement('a');
                    al.href = `../../webedit/${item.name}_annotate.html`;
                    al.textContent = ' (edit) ';
                    al.className = 'action-mutate';
                    li.appendChild(al);

                    // Source
                    const a3 = document.createElement('a');
                    a3.href = `../${item.name}/attribution.html`;
                    a3.textContent = ' (source) ';
                    li.appendChild(a3);

                    // Export sheet
                    const a4 = document.createElement('a');
                    a4.href = '#';
                    a4.textContent = ' (export sheet) ';
                    a4.className = 'action-mutate';
                    a4.onclick = function(e) {
                        e.preventDefault();
                        exportToSheet(item.name, this);
                    };
                    li.appendChild(a4);

                    // Import sheet
                    const a5 = document.createElement('a');
                    a5.href = '#';
                    a5.textContent = ' (import sheet) ';
                    a5.className = 'action-mutate';
                    a5.onclick = function(e) {
                        e.preventDefault();
                        importFromSheet(item.name, this);
                    };
                    li.appendChild(a5);

                    // Upload
                    const a6 = document.createElement('a');
                    a6.href = '#';
                    a6.textContent = ' (upload) ';
                    a6.className = 'action-mutate';
                    a6.onclick = function(e) {
                        e.preventDefault();
                        const fileInput = document.createElement('input');
                        fileInput.type = 'file';
                        fileInput.accept = '.geojson,application/json';
                        fileInput.onchange = function(e) {
                            const file = e.target.files[0];
                            if (!file) return;
                            const reader = new FileReader();
                            reader.onload = function(e) {
                                try {
                                    const geojson = JSON.parse(e.target.result);
                                    geojson.layer = item.name;
                                    geojson.action = 'create';
                                    var xmlhttp = new XMLHttpRequest();
                                    xmlhttp.open("POST", `${baseurl}:${atlasappport}/delta_upload/${swalename}`);
                                    xmlhttp.setRequestHeader("Content-Type", "application/json");
                                    xmlhttp.send(JSON.stringify({"data": geojson}));
                                    xmlhttp.onreadystatechange = function() {
                                        if (xmlhttp.readyState == 4 && xmlhttp.status == 200) {
                                            alert('Upload successful!');
                                        } else if (xmlhttp.readyState == 4 && xmlhttp.status !== 200) {
                                            alert('Error uploading file: ' + (xmlhttp.responseText || 'Unknown error'));
                                        }
                                    };
                                } catch (error) {
                                    alert('Error reading file: ' + error.message);
                                }
                            };
                            reader.readAsText(file);
                        };
                        fileInput.click();
                    };
                    li.appendChild(a6);

                    // Clear (destructive)
                    const refreshLink = document.createElement('a');
                    refreshLink.href = '#';
                    refreshLink.textContent = ' (clear) ';
                    refreshLink.className = 'action-destructive';
                    refreshLink.onclick = function(e) {
                        e.preventDefault();
                        fetch(`${baseurl}:${atlasappport}/clear_layer/${swalename}/${item.name}`)
                            .then(response => response.json())
                            .then(data => {
                                if (data.status === 'success') {
                                    alert('Refresh successful!');
                                    window.location.reload();
                                } else {
                                    alert('Refresh failed: ' + data.message);
                                }
                            })
                            .catch(error => {
                                alert('Error during refresh: ' + error);
                            });
                    };
                    li.appendChild(refreshLink);

                    layersList.appendChild(li);
                });
            }
        }

        function startPublish() {
            const statusDiv = document.getElementById('publish-status');
            const publishButton = document.getElementById('publish-button');
            publishButton.disabled = true;
            statusDiv.innerHTML = `Processing... ${swalename}`;
            fetch(`${baseurl}:${atlasappport}/publish?swale=${swalename}`)
                .then(response => response.json())
                .then(data => {
                    if (data.publishing) {
                        statusDiv.innerHTML = 'Publishing in progress...';
                        pollPublishStatus();
                    }
                })
                .catch(error => {
                    statusDiv.innerHTML = 'Error: ' + error;
                    publishButton.disabled = false;
                });
        }

        function pollPublishStatus() {
            const statusDiv = document.getElementById('publish-status');
            const publishButton = document.getElementById('publish-button');
            fetch(`${baseurl}:${atlasappport}/publish-status?swale=${swalename}`)
                .then(response => response.json())
                .then(data => {
                    if (data.publishing) {
                        statusDiv.innerHTML = 'Publishing in progress...<br>' + data.log.join('<br>');
                        setTimeout(pollPublishStatus, 5000);
                    } else {
                        statusDiv.innerHTML = 'Publishing complete!';
                        publishButton.disabled = false;
                    }
                })
                .catch(error => {
                    statusDiv.innerHTML = 'Error: ' + error;
                    publishButton.disabled = false;
                });
        }

        function startRollback() {
            const statusDiv = document.getElementById('publish-status');
            const rollbackButton = document.getElementById('rollback-button');
            if (!confirm('Are you sure you want to rollback to the previous version?')) return;
            rollbackButton.disabled = true;
            statusDiv.innerHTML = `Rolling back ${swalename}...`;
            fetch(`${baseurl}:${atlasappport}/set-current-version/${swalename}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        statusDiv.innerHTML = `Rollback complete! ${data.message}`;
                    } else {
                        statusDiv.innerHTML = 'Rollback failed: ' + (data.detail || 'Unknown error');
                    }
                    rollbackButton.disabled = false;
                })
                .catch(error => {
                    statusDiv.innerHTML = 'Error: ' + error;
                    rollbackButton.disabled = false;
                });
        }

        function startResetStaging() {
            const statusDiv = document.getElementById('publish-status');
            const resetButton = document.getElementById('reset-staging-button');
            if (!confirm('Are you sure you want to reset staging? This will:\n\n• Backup current staging to staging-backup-{timestamp}\n• Replace staging with the CURRENT published version\n\nAny uncommitted changes in staging will be moved to the backup.')) return;
            resetButton.disabled = true;
            statusDiv.innerHTML = `Resetting staging for ${swalename}...`;
            fetch(`${baseurl}:${atlasappport}/reset-staging/${swalename}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        statusDiv.innerHTML = `Staging reset complete! Reset from ${data.source_version}. Backup saved to ${data.backup_path}`;
                    } else {
                        statusDiv.innerHTML = 'Reset failed: ' + (data.detail || 'Unknown error');
                    }
                    resetButton.disabled = false;
                })
                .catch(error => {
                    statusDiv.innerHTML = 'Error: ' + error;
                    resetButton.disabled = false;
                });
        }

        function exportToSheet(layerName, linkElement) {
            const originalText = linkElement.textContent;
            linkElement.textContent = ' (exporting...) ';
            linkElement.style.pointerEvents = 'none';
            fetch(`${baseurl}:${atlasappport}/export_gsheet/${swalename}/${layerName}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        const urlMatch = data.message.match(/https:\/\/docs\.google\.com\/spreadsheets\/d\/[^'"]+/);
                        if (urlMatch) {
                            alert(`Export successful! Opening Google Sheets...`);
                            window.open(urlMatch[0], '_blank');
                        } else {
                            alert('Export successful! Check the console for details.');
                        }
                    } else {
                        alert('There was a problem with the export. Check the console for details.');
                    }
                })
                .catch(error => {
                    alert('There was a problem with the export. Check the console for details.');
                })
                .finally(() => {
                    linkElement.textContent = originalText;
                    linkElement.style.pointerEvents = 'auto';
                });
        }

        function importFromSheet(layerName, linkElement) {
            const originalText = linkElement.textContent;
            linkElement.textContent = ' (importing...) ';
            linkElement.style.pointerEvents = 'none';
            fetch(`${baseurl}:${atlasappport}/import_sheet/${swalename}/${layerName}`, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        alert(`Import successful! Layer "${layerName}" has been refreshed.`);
                    } else {
                        alert('There was a problem with the import. Check the console for details.');
                    }
                })
                .catch(error => {
                    alert('There was a problem with the import. Check the console for details.');
                })
                .finally(() => {
                    linkElement.textContent = originalText;
                    linkElement.style.pointerEvents = 'auto';
                });
        }
    </script>
</body>
</html>
