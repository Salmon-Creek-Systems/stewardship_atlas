<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{title}</title>
    <script src='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css' rel='stylesheet' />
    <script src='https://unpkg.com/@geomatico/maplibre-cog-protocol@0.8.0/dist/index.js'></script>
    <link href='css/map.css' rel='stylesheet' />
    <link href='css/shared_controls.css' rel='stylesheet' />
    <link href='css/console.css' rel='stylesheet' />
    <link href='https://www.unpkg.com/@watergis/maplibre-gl-legend@latest/dist/maplibre-gl-legend.css' rel='stylesheet' />
    <script src="https://www.unpkg.com/@watergis/maplibre-gl-legend@latest/dist/maplibre-gl-legend.umd.js"></script>

</head>
<body>
    <div id="controls" class="loading">
        <!-- Title Panel -->
        <div class="control-panel title-panel">
            <h4>{title}</h4>
            {qr_code}
            <button id="nav-collapse-btn" class="nav-collapse-btn" title="Collapse panel">▾</button>
        </div>

        <!-- Collapsible body -->
        <div id="nav-body">
            <!-- Loading overlay (covers nav-body while tiles load; position:absolute so doesn't affect flow) -->
            <div id="nav-loading-overlay"><span>Loading layers...</span></div>

            <!-- View Panel -->
            <div class="control-panel view-panel">
                <label>Basemap:</label>
                <select id="basemap-select" class="input-field">
                    {lidar_basemap_option}<option value="usgs">USGS Topo</option>
                    <option value="satellite">Satellite (ESRI)</option>
                    <option value="terrain">OpenMapTiles Terrain</option>
                    <option value="shaded-relief">USGS Shaded Relief (WMS)</option>
                </select>
            </div>

            <!-- Sharing Panel -->
            <div class="control-panel sharing-panel">
                <button id="share-view-btn" class="button" style="width: 100%; padding: 5px; margin-bottom: 5px;">Share</button>
                <label>Share format:</label>
                <select id="coords-format-select" class="input-field">
                    <option value="json">JSON coordinates</option>
                    <option value="google">Google Maps link</option>
                    <option value="internal">Internal map link</option>
                </select>
                <input type="text" id="location-input" class="input-field" placeholder="paste location here" style="width: calc(100% - 50px); display: inline-block;">
                <button id="go-location-btn" class="button" style="width: 40px; margin-left: 5px; padding: 5px;">Go</button>
            </div>

            <!-- Navigation Panel -->
            <div class="control-panel nav-panel">
                <a href="../html/admin" class="button link-button">Home</a>
                <a href="../3dview/" class="button link-button">3D</a>
                <a href="#" class="button link-button" id="help-link">?</a>
            </div>
        </div>
    </div>
    <div id="map"></div>
    
    <!-- Help popup -->
    <div id="help-popup" class="help-popup" style="display: none;">
        <div class="help-content">
            <div class="help-header">
                <h2>Interactive Web Map Help</h2>
                <button id="close-help" class="close-button">&times;</button>
            </div>
            <div class="help-body">
                {webmap_help}
            </div>
        </div>
    </div>
    <script src="js/shared_utils.js"></script>
    <script>
        maplibregl.addProtocol('cog', MaplibreCOGProtocol.cogProtocol);

        // API URL for backend calls
        const API_URL = "{app_url}";
        const SWALENAME = "{swalename}";
        
        // Define constants for webmap
        const SATELLITE_SOURCE = {{
            'type': 'raster',
            'tiles': [
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{{z}}/{{y}}/{{x}}'
            ],
            'tileSize': 256,
            'attribution': 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        }};
        const USGS_SOURCE = {{
            'type': 'raster',
            'tiles': [
                'https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{{z}}/{{y}}/{{x}}'
            ],
            'tileSize': 256,
            'attribution': 'Tiles courtesy of the U.S. Geological Survey'
        }};
        const TERRAIN_SOURCE = {{
            'type': 'raster',
            'tiles': [
                'https://tile.opentopomap.org/{{z}}/{{x}}/{{y}}.png'
            ],
            'tileSize': 256,
            'attribution': 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap (CC-BY-SA)'
        }};
        const SHADED_RELIEF_SOURCE = {{
            'type': 'raster',
            'tiles': [
                'https://basemap.nationalmap.gov/arcgis/services/USGSShadedReliefOnly/MapServer/WMSServer?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=0&STYLES=&FORMAT=image/png&TRANSPARENT=true&CRS=EPSG:3857&WIDTH=256&HEIGHT=256&BBOX={{bbox-epsg-3857}}'
            ],
            'tileSize': 256,
            'attribution': 'USGS Shaded Relief'
        }};

        // Initialize the map
        const MAP_CONFIG = {map_config};
        const LEGEND_TARGETS = {legend_targets};
        const COG_SOURCES = {cog_sources};
        const COG_LAYERS = {cog_layers};
    </script>
    <script src="js/webmap.js"></script>
    <script>
        (function() {{
            var toggle = document.getElementById('qr-toggle');
            var popup  = document.getElementById('qr-popup');
            if (!toggle) return;
            toggle.addEventListener('click', function(e) {{
                e.stopPropagation();
                popup.classList.toggle('visible');
            }});
            document.addEventListener('click', function() {{
                popup.classList.remove('visible');
            }});
        }})();
    </script>
</body>
</html>
