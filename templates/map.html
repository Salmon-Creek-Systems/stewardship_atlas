<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{title}</title>
    <script src='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css' rel='stylesheet' />
    <script src='https://unpkg.com/@geomatico/maplibre-cog-protocol@0.8.0/dist/index.js'></script>
    <link href='css/map.css' rel='stylesheet' />
    <link href='css/shared_controls.css' rel='stylesheet' />
    <link href='css/console.css' rel='stylesheet' />
    <link href='https://www.unpkg.com/@watergis/maplibre-gl-legend@latest/dist/maplibre-gl-legend.css' rel='stylesheet' />
    <script src="https://www.unpkg.com/@watergis/maplibre-gl-legend@latest/dist/maplibre-gl-legend.umd.js"></script>

</head>
<body>
    <div id="controls" class="webmap-controls loading">
        <!-- Header row: atlas name, QR, nav links and the collapse toggle -->
        <div class="control-panel title-panel header-row">
            <h4>{title}</h4>
            {qr_code}
            <nav class="header-links">
                <a href="../console/public/" class="header-link">Home</a>
                <a href="../3dview/" class="header-link">3D</a>
                <a href="/local/documents/user_manual.html#the-web-map" target="_blank" class="header-link" id="help-link" title="Help: using the web map">?</a>
            </nav>
            <button id="nav-collapse-btn" class="nav-collapse-btn" title="Collapse panel">▾</button>
        </div>

        <!-- Collapsible body -->
        <div id="nav-body">
            <!-- Loading overlay (covers nav-body while tiles load; position:absolute so doesn't affect flow) -->
            <div id="nav-loading-overlay"><span>Loading layers...</span></div>

            <!-- Regions Panel (only when the atlas has a regions layer) -->
            {regions_panel}

            <!-- Sharing Panel: both buttons open a pop-up (share-popup / goto-popup below) -->
            <div class="control-panel sharing-panel">
                <div class="sharing-buttons">
                    <div class="sharing-button-cell">
                        <button id="share-view-btn" class="button">Share</button>
                        <div class="sharing-hint">(Ctrl/&#8984;-click to share pin)</div>
                    </div>
                    <div class="sharing-button-cell">
                        <button id="goto-btn" class="button">Go to&hellip;</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <div id="map"></div>

    <!-- Basemap picker: webmap.js moves this into the Visibility (legend) panel once it exists -->
    <div id="basemap-control" class="basemap-control" style="display: none;">
        <label for="basemap-select">Basemap</label>
        <select id="basemap-select" class="input-field">
            {lidar_basemap_option}<option value="usgs">USGS Topo</option>
            <option value="satellite">Satellite (ESRI)</option>
            <option value="terrain">OpenMapTiles Terrain</option>
            <option value="shaded-relief">USGS Shaded Relief (WMS)</option>
            <option value="none">None</option>
        </select>
    </div>

    <!-- Share pop-up: opened by the Share button (view link) and by modifier-click / long press (pin link) -->
    <div id="share-popup" class="help-popup map-popup" style="display: none;">
        <div class="help-content">
            <div class="help-header">
                <h2 id="share-popup-title">Share view</h2>
                <a href="/local/documents/help/share_location.html" target="_blank" class="help-icon" title="Help: sharing a view or a pin">?</a>
                <button class="close-button" data-close-popup>&times;</button>
            </div>
            <div class="help-body">
                <label for="share-format-select">Link type</label>
                <select id="share-format-select" class="input-field">
                    <option value="internal">Internal map link</option>
                    <option value="google">Google Maps link</option>
                    <option value="json">JSON coordinates</option>
                </select>
                <textarea id="share-link-text" class="input-field" rows="3" readonly></textarea>
                <button id="share-copy-btn" class="button">Copy to clipboard</button>
            </div>
        </div>
    </div>

    <!-- Go-to pop-up -->
    <div id="goto-popup" class="help-popup map-popup" style="display: none;">
        <div class="help-content">
            <div class="help-header">
                <h2>Go to location</h2>
                <a href="/local/documents/help/go_to_location.html" target="_blank" class="help-icon" title="Help: going to a location">?</a>
                <button class="close-button" data-close-popup>&times;</button>
            </div>
            <div class="help-body">
                <label for="location-input">Paste a location or link</label>
                <input type="text" id="location-input" class="input-field" placeholder="40.24, -123.96 &middot; Google Maps link &middot; JSON">
                <button id="go-location-btn" class="button">Go to</button>
            </div>
        </div>
    </div>
    
    <script src="js/shared_utils.js"></script>
    <script>
        maplibregl.addProtocol('cog', MaplibreCOGProtocol.cogProtocol);

        // API URL for backend calls
        const API_URL = "{app_url}";
        const SWALENAME = "{swalename}";
        
        // Define constants for webmap
        const SATELLITE_SOURCE = {{
            'type': 'raster',
            'tiles': [
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{{z}}/{{y}}/{{x}}'
            ],
            'tileSize': 256,
            'attribution': 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        }};
        const USGS_SOURCE = {{
            'type': 'raster',
            'tiles': [
                'https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{{z}}/{{y}}/{{x}}'
            ],
            'tileSize': 256,
            'attribution': 'Tiles courtesy of the U.S. Geological Survey'
        }};
        const TERRAIN_SOURCE = {{
            'type': 'raster',
            'tiles': [
                'https://tile.opentopomap.org/{{z}}/{{x}}/{{y}}.png'
            ],
            'tileSize': 256,
            'attribution': 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap (CC-BY-SA)'
        }};
        const SHADED_RELIEF_SOURCE = {{
            'type': 'raster',
            'tiles': [
                'https://basemap.nationalmap.gov/arcgis/services/USGSShadedReliefOnly/MapServer/WMSServer?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=0&STYLES=&FORMAT=image/png&TRANSPARENT=true&CRS=EPSG:3857&WIDTH=256&HEIGHT=256&BBOX={{bbox-epsg-3857}}'
            ],
            'tileSize': 256,
            'attribution': 'USGS Shaded Relief'
        }};

        // Initialize the map
        const MAP_CONFIG = {map_config};
        const LEGEND_TARGETS = {legend_targets};
        const COG_SOURCES = {cog_sources};
        const COG_LAYERS = {cog_layers};
        const DEFAULT_VIEW = {default_view};
        const SHOW_USER_LOCATION = {show_user_location};
    </script>
    <script src="js/webmap.js"></script>
    <script>
        (function() {{
            var toggle = document.getElementById('qr-toggle');
            var popup  = document.getElementById('qr-popup');
            if (!toggle) return;
            toggle.addEventListener('click', function(e) {{
                e.stopPropagation();
                popup.classList.toggle('visible');
            }});
            document.addEventListener('click', function() {{
                popup.classList.remove('visible');
            }});
        }})();
    </script>
</body>
</html>
