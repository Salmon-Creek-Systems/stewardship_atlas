<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atlas Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/local/css/console_new.css">
</head>
<body>

<header class="topbar">
    <img id="logo" class="topbar-logo" alt="">
    <div class="topbar-title">
        <span class="topbar-name" id="swale-name"></span>
        <span class="topbar-type" id="console-type"></span>
    </div>
</header>

<div class="layout">
    <!-- Sidebar: desktop only -->
    <nav class="sidebar" id="sidebar">

        <div class="sb-section" id="sb-maps-section" style="display:none">
            <button class="sb-toggle" aria-expanded="true">
                <span>Maps</span>
                <svg class="chevron" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <ul class="sb-list" id="sb-maps-list"></ul>
        </div>

        <div class="sb-section" id="sb-downloads-section" style="display:none">
            <button class="sb-toggle" aria-expanded="true">
                <span>Downloads</span>
                <svg class="chevron" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <ul class="sb-list" id="sb-downloads-list"></ul>
        </div>

        <div class="sb-section">
            <button class="sb-toggle" aria-expanded="true">
                <span>Help</span>
                <svg class="chevron" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <ul class="sb-list">
                <li><a href="/local/documents/about.html">About</a></li>
                <li><a href="/local/documents/help/index.html">Help</a></li>
                <li><a href="../internal">Internal</a></li>
                <li><a href="../admin">Admin</a></li>
                <li><a href="/local/documents/contact.html">Contact</a></li>
            </ul>
        </div>

        <div class="sb-section" id="sb-versions-section">
            <button class="sb-toggle" aria-expanded="true">
                <span>Publish</span>
                <svg class="chevron" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="sb-body">
                <div class="version-badge" id="sb-version-badge"></div>
                <div class="version-actions">
                    <button class="btn btn-primary btn-sm" id="sb-publish-btn" onclick="startPublish()">Publish</button>
                    <button class="btn btn-sm" id="sb-rollback-btn" onclick="startRollback()">Rollback</button>
                    <button class="btn btn-danger btn-sm" id="sb-reset-btn" onclick="startResetStaging()">Reset Staging</button>
                </div>
                <div class="publish-status" id="publish-status"></div>
                <ul class="sb-list version-list" id="sb-version-list"></ul>
            </div>
        </div>

    </nav>

    <!-- Main content -->
    <main class="main" id="main-content">
        <div class="panel-label" id="panel-label" style="display:none"></div>
        <ul class="layer-list" id="layers-list"></ul>
        <div id="usecases-container"></div>
    </main>
</div>

<!-- Mobile bottom tab bar -->
<nav class="bottom-tabs" id="bottom-tabs" aria-label="Main navigation">
    <button class="tab-btn active" data-tab="layers" onclick="switchTab('layers')">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="2" y="4" width="16" height="2.5" rx="1.25" fill="currentColor"/>
            <rect x="2" y="8.75" width="16" height="2.5" rx="1.25" fill="currentColor"/>
            <rect x="2" y="13.5" width="16" height="2.5" rx="1.25" fill="currentColor"/>
        </svg>
        <span>Layers</span>
    </button>
    <button class="tab-btn" data-tab="maps" onclick="switchTab('maps')">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M2 5l5 2 6-3 5 2v11l-5-2-6 3-5-2V5z" stroke="currentColor" stroke-width="1.5" fill="none"/>
            <path d="M7 7v11M13 4v11" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span>Maps</span>
    </button>
    <button class="tab-btn" data-tab="publish" onclick="switchTab('publish')">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M10 13V4M6 8l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 16h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Publish</span>
    </button>
    <button class="tab-btn" data-tab="help" onclick="switchTab('help')">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 14v-.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M10 11.5c0-2 3-1.5 3-3.5a3 3 0 00-6 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Help</span>
    </button>
</nav>

<!-- Mobile-only panels (injected below main, shown when tab switches) -->
<div id="mobile-panel-maps" class="mobile-panel" style="display:none">
    <div class="mp-heading">Maps</div>
    <ul class="mp-list" id="mobile-maps-list"></ul>
    <div class="mp-heading">Downloads</div>
    <ul class="mp-list" id="mobile-downloads-list"></ul>
</div>

<div id="mobile-panel-publish" class="mobile-panel" style="display:none">
    <div class="mp-heading">Publish &amp; Versions</div>
    <div class="mobile-publish">
        <div class="version-badge" id="mobile-version-badge"></div>
        <div class="mobile-version-actions">
            <button class="btn btn-primary btn-full" id="mobile-publish-btn" onclick="startPublish()">Publish Atlas</button>
            <button class="btn btn-full" id="mobile-rollback-btn" onclick="startRollback()">Rollback</button>
            <button class="btn btn-danger btn-full" id="mobile-reset-btn" onclick="startResetStaging()">Reset Staging</button>
        </div>
        <ul class="mp-list version-list" id="mobile-version-list"></ul>
    </div>
</div>

<div id="mobile-panel-help" class="mobile-panel" style="display:none">
    <div class="mp-heading">Help</div>
    <ul class="mp-list">
        <li><a href="/local/documents/about.html">About</a></li>
        <li><a href="/local/documents/help/index.html">Help</a></li>
        <li><a href="../internal">Internal</a></li>
        <li><a href="../admin">Admin</a></li>
        <li><a href="/local/documents/contact.html">Contact</a></li>
    </ul>
</div>

<!-- Toast container -->
<div id="toast-container" class="toast-container"></div>

<script>
// ── Globals ──────────────────────────────────────────────
let swalename, baseurl, atlasappport, apiurl;
let activeTab = 'layers';

// ── Toast ────────────────────────────────────────────────
function showToast(message, isError) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast ' + (isError ? 'toast-error' : 'toast-ok');
    toast.textContent = message;
    container.appendChild(toast);
    requestAnimationFrame(() => {
        requestAnimationFrame(() => toast.classList.add('toast-in'));
    });
    setTimeout(() => {
        toast.classList.remove('toast-in');
        setTimeout(() => toast.remove(), 250);
    }, 3200);
}

// ── Mobile tab switching ─────────────────────────────────
function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    const main = document.getElementById('main-content');
    ['maps', 'publish', 'help'].forEach(t => {
        const panel = document.getElementById('mobile-panel-' + t);
        if (panel) panel.style.display = (tab === t) ? '' : 'none';
    });
    main.style.display = (tab === 'layers') ? '' : 'none';
}

// ── Sidebar collapse ─────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.sb-toggle').forEach(function(toggle) {
        toggle.addEventListener('click', function() {
            const section = toggle.closest('.sb-section');
            const body = section.querySelector('.sb-list, .sb-body');
            const expanded = toggle.getAttribute('aria-expanded') === 'true';
            toggle.setAttribute('aria-expanded', String(!expanded));
            if (body) body.style.display = expanded ? 'none' : '';
        });
    });
});

// ── Close dropdowns on outside click ────────────────────
document.addEventListener('click', function(e) {
    if (!e.target.closest('.dd-wrap')) {
        document.querySelectorAll('.dd-menu.open').forEach(m => m.classList.remove('open'));
        document.querySelectorAll('.dd-trigger.open').forEach(b => b.classList.remove('open'));
    }
});

// ── Publish / versions ───────────────────────────────────
function setPublishUI(disabled, label) {
    ['sb-publish-btn', 'mobile-publish-btn'].forEach(function(id) {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.disabled = disabled;
        btn.textContent = label;
    });
}

function setPublishStatus(html) {
    const el = document.getElementById('publish-status');
    if (el) el.innerHTML = html;
}

function startPublish() {
    setPublishUI(true, 'Publishing…');
    setPublishStatus('Starting…');
    fetch(apiurl + '/publish?swale=' + swalename)
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.publishing) {
                setPublishStatus('In progress…');
                pollPublishStatus();
            }
        })
        .catch(function(err) {
            setPublishStatus('Error: ' + err);
            setPublishUI(false, 'Publish');
            showToast('Publish failed', true);
        });
}

function pollPublishStatus() {
    fetch(apiurl + '/publish-status?swale=' + swalename)
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.publishing) {
                const lines = (d.log || []).map(function(l) { return Array.isArray(l) ? l[0] : l; });
                setPublishStatus(lines.slice(-4).join('<br>'));
                setTimeout(pollPublishStatus, 5000);
            } else {
                setPublishStatus('Complete');
                setPublishUI(false, 'Publish');
                showToast('Published successfully');
            }
        })
        .catch(function(err) {
            setPublishStatus('Poll error: ' + err);
            setPublishUI(false, 'Publish');
        });
}

function startRollback() {
    if (!confirm('Roll back to the previous published version?')) return;
    ['sb-rollback-btn', 'mobile-rollback-btn'].forEach(function(id) {
        const btn = document.getElementById(id);
        if (btn) btn.disabled = true;
    });
    fetch(apiurl + '/set-current-version/' + swalename)
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.status === 'success') {
                showToast('Rolled back: ' + d.message);
                setPublishStatus('Rolled back to ' + d.current_version);
            } else {
                showToast('Rollback failed: ' + (d.detail || 'Unknown'), true);
            }
        })
        .catch(function() { showToast('Rollback error', true); })
        .finally(function() {
            ['sb-rollback-btn', 'mobile-rollback-btn'].forEach(function(id) {
                const btn = document.getElementById(id);
                if (btn) btn.disabled = false;
            });
        });
}

function startResetStaging() {
    if (!confirm('Reset staging?\n\n• Current staging will be backed up\n• Staging will be replaced with the CURRENT published version\n\nUncommitted changes will be moved to the backup.')) return;
    ['sb-reset-btn', 'mobile-reset-btn'].forEach(function(id) {
        const btn = document.getElementById(id);
        if (btn) btn.disabled = true;
    });
    fetch(apiurl + '/reset-staging/' + swalename)
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.status === 'success') {
                showToast('Staging reset from ' + d.source_version);
                setPublishStatus('Reset from ' + d.source_version);
            } else {
                showToast('Reset failed: ' + (d.detail || 'Unknown'), true);
            }
        })
        .catch(function() { showToast('Reset error', true); })
        .finally(function() {
            ['sb-reset-btn', 'mobile-reset-btn'].forEach(function(id) {
                const btn = document.getElementById(id);
                if (btn) btn.disabled = false;
            });
        });
}

// ── Layer operations ─────────────────────────────────────
function toggleDropdown(triggerBtn) {
    const menu = triggerBtn.nextElementSibling;
    const isOpen = triggerBtn.classList.contains('open');
    document.querySelectorAll('.dd-menu.open').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.dd-trigger.open').forEach(b => b.classList.remove('open'));
    if (!isOpen) {
        triggerBtn.classList.add('open');
        menu.classList.add('open');
    }
}

function exportToSheet(layerName, btn) {
    const orig = btn.textContent;
    btn.textContent = 'Exporting…';
    btn.disabled = true;
    fetch(apiurl + '/export_gsheet/' + swalename + '/' + layerName)
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.status === 'success') {
                const m = d.message && d.message.match(/https:\/\/docs\.google\.com\/spreadsheets\/d\/[^'"]+/);
                if (m) window.open(m[0], '_blank');
                showToast('“' + layerName + '” exported to Sheets');
            } else {
                showToast('Export failed', true);
            }
        })
        .catch(function() { showToast('Export error', true); })
        .finally(function() { btn.textContent = orig; btn.disabled = false; });
}

function importFromSheet(layerName, btn) {
    const orig = btn.textContent;
    btn.textContent = 'Importing…';
    btn.disabled = true;
    fetch(apiurl + '/import_sheet/' + swalename + '/' + layerName, { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.status === 'success') {
                showToast('“' + layerName + '” imported from sheet');
            } else {
                showToast('Import failed', true);
            }
        })
        .catch(function() { showToast('Import error', true); })
        .finally(function() { btn.textContent = orig; btn.disabled = false; });
}

function uploadGeoJSON(layerName) {
    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.geojson,application/json';
    fileInput.onchange = function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
            try {
                var geojson = JSON.parse(e.target.result);
                geojson.layer = layerName;
                geojson.action = 'create';
                var xhr = new XMLHttpRequest();
                xhr.open('POST', apiurl + '/delta_upload/' + swalename);
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200) {
                            showToast('“' + layerName + '” uploaded');
                        } else {
                            showToast('Upload failed: ' + (xhr.responseText || 'Unknown'), true);
                        }
                    }
                };
                xhr.send(JSON.stringify({ data: geojson }));
            } catch(err) {
                showToast('Invalid GeoJSON: ' + err.message, true);
            }
        };
        reader.readAsText(file);
    };
    fileInput.click();
}

function clearLayer(layerName) {
    if (!confirm('Clear all data from “' + layerName + '”?\n\nThis cannot be undone.')) return;
    fetch(apiurl + '/clear_layer/' + swalename + '/' + layerName)
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.status === 'success') {
                showToast('“' + layerName + '” cleared');
            } else {
                showToast('Clear failed: ' + (d.message || 'Unknown'), true);
            }
        })
        .catch(function() { showToast('Clear error', true); });
}

// ── Use cases ────────────────────────────────────────────
function renderUseCases(useCases) {
    var container = document.getElementById('usecases-container');
    container.innerHTML = '';
    useCases.forEach(function(usr) {
        if (!usr.cases || usr.cases.length === 0) return;
        var section = document.createElement('div');
        section.className = 'uc-section';
        var heading = document.createElement('div');
        heading.className = 'uc-heading';
        heading.textContent = usr.name;
        section.appendChild(heading);
        var list = document.createElement('ul');
        list.className = 'uc-list';
        usr.cases.forEach(function(ucase) {
            var li = document.createElement('li');
            var a = document.createElement('a');
            a.href = ucase.uri;
            a.textContent = ucase.name;
            li.appendChild(a);
            list.appendChild(li);
        });
        section.appendChild(list);
        container.appendChild(section);
    });
}

// ── Main init ────────────────────────────────────────────
function initializePage(data) {
    swalename    = data.swaleName;
    baseurl      = data.baseurl;
    atlasappport = data.atlasappport;
    apiurl       = data.apiurl;

    // Top bar
    var logo = document.getElementById('logo');
    if (data.logo) { logo.src = data.logo; } else { logo.style.display = 'none'; }
    document.getElementById('swale-name').textContent = data.swaleName;
    document.getElementById('console-type').textContent = data.consoleType;

    // Panel label
    if (data.panelHeader) {
        var lbl = document.getElementById('panel-label');
        lbl.textContent = data.panelHeader;
        lbl.style.display = '';
    }

    // Version badge (both sidebar and mobile)
    ['sb-version-badge', 'mobile-version-badge'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.textContent = data.version_string || 'staging';
    });

    // Version lists
    if (data.versions && data.versions.length > 0) {
        ['sb-version-list', 'mobile-version-list'].forEach(function(listId) {
            var list = document.getElementById(listId);
            if (!list) return;
            data.versions.forEach(function(v) {
                var li = document.createElement('li');
                var a = document.createElement('a');
                a.href = data.baseurl + '/' + v + '/outlets/html/admin';
                a.textContent = v === data.version_string ? v + ' (current)' : v;
                if (v === data.version_string) a.className = 'current-version';
                li.appendChild(a);
                list.appendChild(li);
            });
        });
    } else {
        var sec = document.getElementById('sb-versions-section');
        if (sec) sec.style.display = 'none';
    }

    // Interfaces (Maps)
    if (data.interfaces && data.interfaces.length > 0) {
        ['sb-maps-list', 'mobile-maps-list'].forEach(function(listId) {
            var list = document.getElementById(listId);
            if (!list) return;
            data.interfaces.forEach(function(item) {
                var li = document.createElement('li');
                var a = document.createElement('a');
                a.href = '../../' + item.name + '/';
                a.textContent = item.name;
                li.appendChild(a);
                list.appendChild(li);
            });
        });
        var mapsSection = document.getElementById('sb-maps-section');
        if (mapsSection) mapsSection.style.display = '';
    }

    // Downloads
    if (data.downloads && data.downloads.length > 0) {
        ['sb-downloads-list', 'mobile-downloads-list'].forEach(function(listId) {
            var list = document.getElementById(listId);
            if (!list) return;
            data.downloads.forEach(function(item) {
                var li = document.createElement('li');
                var a = document.createElement('a');
                a.href = '../' + item.name + '/';
                a.textContent = item.name;
                li.appendChild(a);
                list.appendChild(li);
            });
        });
        var dlSection = document.getElementById('sb-downloads-section');
        if (dlSection) dlSection.style.display = '';
    }

    // PUBLIC: embed webmap
    if (data.consoleType === 'PUBLIC' && data.webmapAvailable) {
        var main = document.getElementById('main-content');
        main.innerHTML = '';
        main.style.padding = '0';
        var iframe = document.createElement('iframe');
        iframe.src = '../../webmap/';
        iframe.className = 'webmap-iframe';
        iframe.title = 'Atlas Webmap';
        main.appendChild(iframe);
        document.getElementById('sidebar').style.display = 'none';
    }

    // Layers (ADMINISTRATION only)
    if (data.layers && data.layers.length > 0) {
        var layerList = document.getElementById('layers-list');
        data.layers.forEach(function(item) {
            var li = document.createElement('li');
            li.className = 'layer-row';

            // Name
            var nameLink = document.createElement('a');
            nameLink.href = '../../../layers/' + item.name + '/';
            nameLink.className = 'layer-name';
            nameLink.textContent = item.name;
            li.appendChild(nameLink);

            // Actions container
            var actions = document.createElement('div');
            actions.className = 'layer-actions';

            // Draw / Edit button group
            var group = document.createElement('div');
            group.className = 'btn-group';

            var drawBtn = document.createElement('a');
            drawBtn.href = '../../webedit/' + item.name + '_create.html';
            drawBtn.className = 'btn btn-sm btn-action';
            drawBtn.textContent = 'Draw';

            var editBtn = document.createElement('a');
            editBtn.href = '../../webedit/' + item.name + '_annotate.html';
            editBtn.className = 'btn btn-sm btn-action';
            editBtn.textContent = 'Edit';

            group.appendChild(drawBtn);
            group.appendChild(editBtn);
            actions.appendChild(group);

            // Data dropdown
            var ddWrap = document.createElement('div');
            ddWrap.className = 'dd-wrap';

            var ddTrigger = document.createElement('button');
            ddTrigger.className = 'btn btn-sm btn-action dd-trigger';
            ddTrigger.setAttribute('aria-haspopup', 'true');
            // Build trigger content without template literals containing braces
            ddTrigger.innerHTML = 'Data <svg width="9" height="9" viewBox="0 0 9 9" style="margin-left:2px;vertical-align:middle;flex-shrink:0"><path d="M1.5 3l3 3 3-3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
            ddTrigger.onclick = function(e) { e.stopPropagation(); toggleDropdown(this); };

            var ddMenu = document.createElement('div');
            ddMenu.className = 'dd-menu';
            ddMenu.setAttribute('role', 'menu');

            // Upload
            var uploadBtn = document.createElement('button');
            uploadBtn.className = 'dd-item';
            uploadBtn.textContent = 'Upload GeoJSON';
            uploadBtn.setAttribute('role', 'menuitem');
            (function(name) {
                uploadBtn.onclick = function() {
                    ddMenu.classList.remove('open');
                    ddTrigger.classList.remove('open');
                    uploadGeoJSON(name);
                };
            })(item.name);
            ddMenu.appendChild(uploadBtn);

            // Export
            var exportBtn = document.createElement('button');
            exportBtn.className = 'dd-item';
            exportBtn.textContent = 'Export to Sheet';
            exportBtn.setAttribute('role', 'menuitem');
            (function(name) {
                exportBtn.onclick = function() { exportToSheet(name, this); };
            })(item.name);
            ddMenu.appendChild(exportBtn);

            // Import
            var importBtn = document.createElement('button');
            importBtn.className = 'dd-item';
            importBtn.textContent = 'Import from Sheet';
            importBtn.setAttribute('role', 'menuitem');
            (function(name) {
                importBtn.onclick = function() { importFromSheet(name, this); };
            })(item.name);
            ddMenu.appendChild(importBtn);

            // Attribution separator
            var sep = document.createElement('div');
            sep.className = 'dd-sep';
            ddMenu.appendChild(sep);

            // Source
            var sourceLink = document.createElement('a');
            sourceLink.className = 'dd-item';
            sourceLink.href = '../' + item.name + '/attribution.html';
            sourceLink.textContent = 'Source / Attribution';
            sourceLink.setAttribute('role', 'menuitem');
            ddMenu.appendChild(sourceLink);

            ddWrap.appendChild(ddTrigger);
            ddWrap.appendChild(ddMenu);
            actions.appendChild(ddWrap);

            // Clear (destructive)
            var clearBtn = document.createElement('button');
            clearBtn.className = 'btn btn-sm btn-clear';
            clearBtn.setAttribute('title', 'Clear layer data');
            clearBtn.setAttribute('aria-label', 'Clear ' + item.name);
            clearBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1.5 3h10M4.5 3V2a.5.5 0 01.5-.5h3a.5.5 0 01.5.5v1M5.5 5.5v4M7.5 5.5v4M2.5 3l.6 7a.5.5 0 00.5.5h5.8a.5.5 0 00.5-.5l.6-7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
            (function(name) {
                clearBtn.onclick = function() { clearLayer(name); };
            })(item.name);
            actions.appendChild(clearBtn);

            li.appendChild(actions);
            layerList.appendChild(li);
        });
    }

    // Use cases / help
    if (data.useCases && data.useCases.length > 0) {
        renderUseCases(data.useCases);
    }

    // TECHNICAL: fetch live log
    if (data.consoleType === 'TECHNICAL') {
        document.getElementById('usecases-container').innerHTML = '<div class="uc-loading">Loading log…</div>';
        fetch(apiurl + '/log/' + swalename)
            .then(function(r) { return r.json(); })
            .then(function(d) { if (d.useCases) renderUseCases(d.useCases); })
            .catch(function() { renderUseCases([{ name: 'Log unavailable', cases: [] }]); });
    }
}
</script>
</body>
</html>
